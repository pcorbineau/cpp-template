[project]
site_name = "libtemplate"
site_description = "A minimal C++23 template library providing common utility functions."

# Paths are resolved relative to this file. The CMake build copies this file
# into the build tree, where site_dir resolves inside the build directory.
docs_dir = "docs"
site_dir = "site"

extra_css = ["stylesheets/custom.css"]
extra_javascript = [
  "javascripts/mathjax.js",
  "javascripts/vendor/mathjax/tex-mml-chtml.js",
  "javascripts/vendor/tablesort/tablesort.min.js",
  "javascripts/vendor/tablesort/tablesort.number.js",
  "javascripts/tablesort.js",
]

# --- offline:begin ---
# The block between the markers is rewritten by CMake. When the documentation
# is packaged for offline use (-DDOCS_OFFLINE=ON), it enables the offline
# plugin, self-hosts the iframe-worker polyfill, disables web fonts and drops
# the instant navigation features that rely on the fetch API.
# --- offline:end ---

[project.theme]
variant = "modern"
custom_dir = "docs/overrides"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "red"
accent = "red"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "red"
accent = "red"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
